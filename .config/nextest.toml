nextest-version = "0.9.100"

[profile.default]
# Pinned so every run uses the same concurrency.
test-threads = "num-cpus"
fail-fast = false
slow-timeout = { period = "60s" }
default-filter = "not (kind(test) | test(/(^|::)it_/))"

[profile.integration]
fail-fast = false
slow-timeout = { period = "60s" }
default-filter = "kind(test) | test(/(^|::)it_/)"

[profile.ci]
fail-fast = false
retries = 1
slow-timeout = { period = "60s", terminate-after = 5 }
default-filter = "all()"
