[advisories]
version = 2
# 2026-09-18: serde_yaml 0.9.34+deprecated (unmaintained upstream) with transitive
# unsafe-libyaml 0.2.11 parses every pipeline template in templates/. Replacement is
# an XL change (LOT-B). If the first cargo deny check advisories run reports a RUSTSEC
# advisory against either crate, add that advisory id here with link to the parser
# replacement ticket (LOC-B or later). Do not add speculative entries.
#
# 2026-09-18: RUSTSEC-2025-0134 (rustls-pemfile unmaintained) has "no safe upgrade
# available" per the advisory itself - it's pulled in transitively via
# ureq -> rustls-native-certs, not a direct dependency. It's a maintenance warning,
# not an active vulnerability. Revisit when ureq drops rustls-pemfile or a
# maintained replacement lands; track under LOC-B alongside the serde_yaml swap.
ignore = ["RUSTSEC-2025-0134"]

[bans]
# Known duplicate versions: getrandom, r-efi, webpki-roots, windows-link, windows-sys.
# These are not vulnerabilities. Set to "warn" on day 1; may be raised to "deny" once
# deduplicated.
multiple-versions = "warn"
wildcards = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
