[workspace]
resolver = "2"
members = [
  "crates/aidp-core",
  "crates/aidp-flows",
  "crates/aidp-cli",
  "crates/aidp-integrations",
  "crates/aidp-gateway",
  "crates/aidp-tickets",
  "crates/aidp-testkit",
  "crates/aidp-agents",
  "crates/aidp-memory",
  "crates/aidp-workspace-hack",
]

[workspace.package]
version = "7.11.0"
edition = "2021"
license = "MIT"
authors = ["aidp v4"]
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
jsonschema = { version = "0.18", default-features = false }
ctrlc = "3"
glob = "0.3"
walkdir = "2"
once_cell = "1"
regex = "1"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
# native-certs: use the OS trust store instead of the bundled Mozilla roots.
# Required on corporate machines whose TLS is terminated by an internal CA that
# webpki-roots does not know - without it every HTTPS call fails with
# "invalid peer certificate: UnknownIssuer".
ureq = { version = "2", features = ["json", "native-certs"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
# Static embeddings, loaded from a local folder only: no hub download, no tokio.
model2vec-rs = { version = "0.4.0", default-features = false, features = ["wasm"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
# Test-only dependencies (LOC-12). Never referenced from a [dependencies] section.
tempfile = "3"
assert_cmd = "2"
predicates = "3"
insta = "1"
proptest = "1"
aidp-testkit = { path = "crates/aidp-testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
# Full debuginfo made every test binary carry a ~150 MB PDB (target/debug hit 60 GB).
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
