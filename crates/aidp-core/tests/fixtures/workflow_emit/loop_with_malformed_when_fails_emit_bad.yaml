version: 5
id: badloop
settings: { max_correction_iterations: 2 }
stages:
  - name: review
    agent: reviewer
    outputs: [findings.json]
  - name: bad_loop
    type: loop
    when: "{{ inputs.keep_going }}"
    max_iterations: 2
    body:
      - { name: refix, agent: executor, needs: [review] }
