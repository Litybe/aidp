version: 5
id: native-autonomous
kind: pipeline
description: Two analyzer stages accepting a free prompt, launched through every daemon path.
inputs:
  feature: { required: false, kind: string, default: native-autonomous }
  prompt: { required: false, kind: string, default: "" }
stages:
  - name: ask
    description: Raise a question or escalate a decision.
    agent: analyzer

  - name: after
    description: Run once the first stage is settled.
    agent: analyzer
    needs: [ask]
