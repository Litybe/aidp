version: 5
id: unity-review
kind: pipeline
description: Minimal stand-in for the skill pipeline unity-review; the fake provider writes its result.json.
inputs:
  feature: { required: false, kind: string, default: game-flow }
  prompt: { required: false, kind: string, default: "" }
  issue: { required: false, kind: string, default: "" }
stages:
  - name: review
    description: Writes the summary; result.json comes from the test provider.
    agent: reviewer
    outputs: [summary.md]
