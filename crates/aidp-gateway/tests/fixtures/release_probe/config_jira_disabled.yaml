# aidp ticket dispatcher configuration (vision §8). Edited by hand, read on
# every tick; a missing or partial file behaves exactly like the defaults
# shown here.

dispatcher:
  slots: 5                      # tickets in-progress at once, across every service
  tick_seconds: 60
  permission_mode: bypassPermissions
  model: claude-sonnet-5
  auto_approve_gates: [pr]      # "*" approves every gate; anything else blocks the ticket (blocked: gate:<stage>)
  max_attempts: 2
  gate_timeout_hours: 12
  paused: false
  max_worktrees_per_project: 3  # tickets of one project that may hold a worktree at once
  worktree_copy:                # untracked files copied into each new worktree
    - ".claude/settings.local.json"
    - ".aidp/*.json"

budget:
  max_utilization_5h: 0.80
  max_utilization_7d: 0.90
  reserve_per_run_5h: 0.10       # estimated cost of one dev run on the 5h window
  reserve_per_run_7d: 0.02
  unknown_policy: conservative   # no snapshot yet: run one session at a time
  learn: true                    # refine the reserve from observed deltas
  rate_limit_patterns:           # substrings that mark a session killed by the usage limit
    - "rate limit"
    - "usage limit"
    - "hit your limit"
    - "429"
    - "rate_limit"

jira:
  enabled: false
  sync_minutes: 10
  jql: 'assignee = currentUser() AND status in ("To Do") AND sprint in openSprints() ORDER BY priority DESC, created ASC'
  write_back:
    transitions: false           # opt-in: To Do -> In Progress -> In Review
    comment_pr: false            # opt-in: comment the PR back onto the ticket
    on_release: false            # opt-in: write the release tag, move to status_map.released
  status_map: { in-progress: "In Progress", in-review: "In Review", done: "Done", released: "QA Validation" }
  finished_statuses: ["To Release", "Done"]   # blocker statuses that no longer block
  release_field: "Package name & Build name"
  release_tag_pattern: '^v?\d+\.\d+\.\d+$'
  release_probe_minutes: 10
  release_watch_hours: 72

local:
  key_prefix: LOC
  archive_after_days: 30         # done/cancelled moved to <service>/archive/
